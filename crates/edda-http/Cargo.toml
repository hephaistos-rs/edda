[package]
name = "edda-http"
version.workspace = true
edition.workspace = true
authors.workspace = true

# The axum application: the git smart-HTTP bridge, account/token routes,
# collaborator-management routes, and cross-cutting middleware
# (observability, health check). Handlers call into `edda-auth`'s
# `AuthorizationService` and `edda-domain`'s pure functions for every
# permission decision — they never re-derive access themselves.
[dependencies]
axum = { workspace = true }
axum-login = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
edda-auth = { workspace = true }
edda-db = { workspace = true }
edda-domain = { workspace = true }
edda-git = { workspace = true }
edda-telemetry = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# This crate's one direct `sqlx::query` use (the `/healthz` liveness
# check, `SELECT 1`, identical on every backend) goes through
# `sqlx::AnyPool` via `edda_db::DbPool`'s exposed `.any` field, so it
# needs the `any` feature enabled — the concrete driver features come
# from `edda-db`, which always compiles all three in (runtime backend
# selection).
sqlx = { workspace = true, features = ["any"] }
tower-http = { workspace = true, features = ["trace"] }
tracing = { workspace = true }
