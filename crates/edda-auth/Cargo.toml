[package]
name = "edda-auth"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

# Authentication (proving identity: passwords, sessions, tokens) and
# authorization (deciding what an identity may do) — two modules in one
# crate, not two crates, since both are identity/permission concerns that
# share the same persistence access and are used together at every
# transport boundary; splitting them would only duplicate wiring without
# a real architectural seam. `authz`'s job is strictly "fetch what edda-domain's pure
# functions need, then call them" — it must never contain a permission
# *decision* itself.
[lints]
workspace = true

[dependencies]
aes-gcm = { workspace = true }
argon2 = { workspace = true }
axum-login = { workspace = true }
base64 = { workspace = true }
# WebAuthn's COSE key access (`CoseKey::to_sec1_octet_string`) and CBOR
# parsing of the attestation object (`coset::cbor` = `ciborium`, re-exported)
# — `webauthn` needs this in addition to the `CoseKey` type `passkey-types`
# itself re-exports, since it also touches `coset::iana`/`coset::cbor`
# directly. See the workspace `Cargo.toml`'s WebAuthn dependency comment for
# why this trio over `webauthn-rs`.
coset = { workspace = true }
edda-db = { workspace = true }
edda-domain = { workspace = true }
# WebAuthn EdDSA (Ed25519) credential verification — the raw-message
# `signature::Verifier` path, alongside `p256` for ES256. See the workspace
# `Cargo.toml`'s comment for why this is the version `russh` already locks.
ed25519-dalek = { workspace = true }
# Per-purpose HS256 secret derivation (`signing_keys`) — see that module.
hkdf = { workspace = true }
# Outgoing webhook payload signing (`webhook_signing`) — see that module's
# doc comment.
hmac = { workspace = true }
# Short-lived "pending 2FA" tokens (`pending_login`) — same crate/pattern
# as the LFS transfer-auth tokens in `edda_http::lfs::transfer_auth`.
jsonwebtoken = { workspace = true }
oauth2 = { workspace = true }
openidconnect = { workspace = true }
# ES256 assertion/attestation signature verification (`p256::ecdsa`) — see
# the workspace `Cargo.toml`'s WebAuthn dependency comment.
p256 = { workspace = true }
# WebAuthn request/response JSON types matching the browser
# `navigator.credentials` shape — see the workspace `Cargo.toml`'s WebAuthn
# dependency comment.
passkey-types = { workspace = true }
rand = { workspace = true, features = ["thread_rng"] }
# WebAuthn RS256 credential verification (RSASSA-PKCS1-v1_5 + SHA-256).
# Workspace-pinned to `russh`'s already-locked version — see that comment.
rsa = { workspace = true }
# Only for `russh::keys` (= the `ssh_key` crate's types, re-exported) —
# public-key parsing and fingerprinting are an authentication-credential
# concern, the same category `argon2`/`sha2` already cover here, not an
# SSH-transport one; this crate never touches `russh::server`/`client`.
# Depending on `russh` directly (rather than the standalone `ssh-key` crate)
# guarantees the exact same `PublicKey` type `edda-ssh` hands this crate at
# the authentication boundary — a separately-versioned `ssh-key` dependency
# could resolve to an incompatible type even at a semver-compatible version.
russh = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# `webauthn::StoredCredential` and OAuth's linked-identity bookkeeping are
# persisted as opaque JSON blobs via `edda-db` — this crate does the
# (de)serialization, `edda-db` just stores the resulting string.
serde_json = { workspace = true }
sha2 = { workspace = true }
# Constant-time equality for the WebAuthn challenge compare (`webauthn`).
subtle = { workspace = true }
thiserror = { workspace = true }
# `spawn_blocking` for Argon2 hashing (`password`) — CPU-bound work must not
# run on an async worker. `rt` only; the multi-thread runtime, macros, and
# net features stay dev-only below.
tokio = { workspace = true, features = ["rt"] }
totp-rs = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# For the `oauth` module's real-HTTP mock-IdP round-trip test only.
axum = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
