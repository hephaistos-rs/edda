[package]
name = "edda"
version.workspace = true
edition.workspace = true
authors.workspace = true

# The workspace's composition root — see plan.local.md §3.3. This is the
# only package that needs to compile for both the wasm32 client and the
# native server (Dioxus fullstack's own constraint), so it's also the only
# package where every server-only dependency below must stay behind
# `dep:`/the `server` feature, exactly as in the pre-restructuring
# single-crate `Cargo.toml` this one replaces.
[dependencies]
axum = { workspace = true, optional = true }
axum-login = { workspace = true, optional = true }
dioxus = { workspace = true, features = ["router", "fullstack"] }
dioxus-free-icons = { workspace = true, features = ["lucide"] }
# `default-features = false` on every one of these that itself depends on
# `edda-db`: backend selection (this file's `sqlite`/`postgres` features,
# below) must be the composition root's decision alone, not forced by any
# dependent crate's own default (plan.local.md §17 Phase 3).
edda-auth = { workspace = true, default-features = false, optional = true }
edda-db = { workspace = true, default-features = false, optional = true }
edda-domain = { workspace = true, optional = true }
edda-git = { workspace = true, optional = true }
edda-http = { workspace = true, default-features = false, optional = true }
edda-ssh = { workspace = true, default-features = false, optional = true }
edda-telemetry = { workspace = true, optional = true }
gloo-net = { workspace = true, features = ["json"], optional = true }
serde = { workspace = true, features = ["derive"] }
# No driver feature hardcoded — comes transitively from whichever of this
# crate's own `sqlite`/`postgres` features is active (below).
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync", "rt", "signal", "time"], optional = true }
tower-sessions = { workspace = true, optional = true }
# No driver feature hardcoded here either — `tower-sessions-sqlx-store`
# gates its `SqliteStore`/`PostgresStore` types behind its own
# `sqlite`/`postgres` features (not auto-derived from `sqlx`'s), so this
# crate's own `sqlite`/`postgres` features (below) select explicitly.
tower-sessions-sqlx-store = { workspace = true, optional = true }
# Not optional: `tracing`'s macros (`info!`, `#[instrument]`, ...) are used
# from server-only code paths, but the facade itself is tiny and
# side-effect-free to depend on — Dioxus already pulls it in transitively
# either way.
tracing = { workspace = true }
# Not optional: used from `ui/`, which compiles for both the wasm client and
# the native server. Plain `std::time::SystemTime::now()` panics on
# wasm32-unknown-unknown (no wall clock without a JS shim) — this is a
# drop-in replacement that's `std::time` on every other target and backed by
# `Date.now()` on wasm32.
web-time = { workspace = true }

[features]
default = ["web", "sqlite"]
web = ["dioxus/web", "dep:gloo-net"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = [
    "dioxus/server",
    "dep:axum",
    "dep:axum-login",
    "dep:edda-auth",
    "dep:edda-db",
    "dep:edda-domain",
    "dep:edda-git",
    "dep:edda-http",
    "dep:edda-ssh",
    "dep:edda-telemetry",
    "dep:sqlx",
    "dep:tokio",
    "dep:tower-sessions",
    "dep:tower-sessions-sqlx-store",
]
# Exactly one of these is meant to be active in a `server` build — see
# `edda-db`'s own `compile_error!` guard, which fires workspace-wide if
# both (or neither) end up enabled. `sqlite` is the zero-config default,
# unchanged from before this phase; `postgres` requires `EDDA_DATABASE_URL`
# and is opted into with `--no-default-features --features postgres,web,server`
# (or `desktop`/`mobile` in place of `web`). Plan.local.md §17 Phase 3.
sqlite = [
    "edda-db?/sqlite",
    "edda-auth?/sqlite",
    "edda-http?/sqlite",
    "edda-ssh?/sqlite",
    "sqlx?/sqlite",
    "tower-sessions-sqlx-store?/sqlite",
]
postgres = [
    "edda-db?/postgres",
    "edda-auth?/postgres",
    "edda-http?/postgres",
    "edda-ssh?/postgres",
    "sqlx?/postgres",
    "tower-sessions-sqlx-store?/postgres",
]
