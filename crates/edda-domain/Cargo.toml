[package]
name = "edda-domain"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

# This crate is the workspace's pure functional core: entities, invariants,
# and authorization/business-rule decisions, with no I/O of any kind. It
# must never gain a `sqlx`, `axum`, `gix`, or `tokio`
# dependency; every other crate in the workspace may depend on it, and it
# must never depend on any of them.
[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v7", "serde"] }
