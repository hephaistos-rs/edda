[package]
name = "edda-db"
version.workspace = true
edition.workspace = true
authors.workspace = true

# The only crate in the workspace allowed to contain `sqlx::query!` — see
# plan.local.md §3.3/§16 (smell S3). Exposes narrow, intention-revealing
# repository structs; never exposes a raw query or a `SqlitePool` method
# beyond what those structs need internally.
[dependencies]
edda-domain = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
