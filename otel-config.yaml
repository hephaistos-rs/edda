# Minimal OpenTelemetry Collector pipeline for local development: receive
# OTLP (from Edda) over HTTP, forward it on to the local Grafana OTel-LGTM
# stack's own OTLP receiver. Kept deliberately small — this is the
# backend-neutral boundary the brief calls for, not a place to bolt on
# processing Edda itself doesn't need locally.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlphttp:
    # `grafana-lgtm`, not `localhost` — inside the container, `localhost`
    # means this collector itself (it's also listening on :4318), not the
    # other compose service. Docker Compose's service-name DNS is what makes
    # this resolve to the actual grafana-lgtm container.
    endpoint: http://grafana-lgtm:4318

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp]
