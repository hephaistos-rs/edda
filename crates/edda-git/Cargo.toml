[package]
name = "edda-git"
version.workspace = true
edition.workspace = true
authors.workspace = true

# Git repository storage and gix-backed operations — server-only,
# transport-agnostic. Both `edda-http`'s
# git-over-HTTP bridge and `edda-ssh`'s git-over-SSH bridge call into this
# crate's `protocol` module for the actual smart-protocol request/response
# orchestration; it knows nothing about either transport (no `axum`, no
# `russh`) — `bytes::Bytes` is a generic, transport-agnostic buffer type,
# not an HTTP- or SSH-specific one, so depending on it directly here (the
# same type both transports already hand around) doesn't violate that.
[dependencies]
bytes = { workspace = true }
edda-domain = { workspace = true }
edda-telemetry = { workspace = true }
flate2 = { workspace = true }
# `merge`: pull-request merging (`merge` module) via `Repository::
# merge_commits` — pulls in `tree-editor` (writing the merged tree) and
# `blob-diff` transitively. See that module's doc comment for why this,
# not `git2`/libgit2.
gix = { workspace = true, features = ["merge"] }
gix-actor = { workspace = true }
gix-hash = { workspace = true, features = ["sha1"] }
gix-object = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt"] }
tracing = { workspace = true }

[dev-dependencies]
# `diff`'s and `merge`'s test fixtures hand-build commits
# (`gix::Repository::edit_tree`) rather than shelling out to `git` — the
# main `gix`/`gix-actor` dependencies above (via the `merge` feature)
# already cover what these tests need.
tokio = { workspace = true, features = ["rt", "macros"] }
