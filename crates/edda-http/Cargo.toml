[package]
name = "edda-http"
version.workspace = true
edition.workspace = true
authors.workspace = true

# The axum application: the git smart-HTTP bridge, account/token routes,
# collaborator-management routes, and cross-cutting middleware
# (observability, health check). Handlers call into `edda-auth`'s
# `AuthorizationService` and `edda-domain`'s pure functions for every
# permission decision — they never re-derive access themselves.
[dependencies]
axum = { workspace = true }
axum-login = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
edda-auth = { workspace = true }
edda-db = { workspace = true }
edda-domain = { workspace = true }
edda-git = { workspace = true }
edda-telemetry = { workspace = true }
# LFS transfer-auth tokens (short-lived HMAC-signed bearer tokens minting
# access to exactly one upload/download URL) — see `lfs::transfer_auth`.
jsonwebtoken = { workspace = true }
# Only for the LFS transfer-auth HMAC secret, generated once per process
# at startup (`lfs::transfer_auth`) — this crate has no other use for
# randomness.
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Only for verifying an uploaded LFS object's content against its
# claimed `oid` (a hex-encoded SHA-256 digest) — the same hash Git LFS
# itself uses to name objects.
sha2 = { workspace = true }
# This crate's one direct `sqlx::query` use (the `/healthz` liveness
# check, `SELECT 1`, identical on every backend) goes through
# `sqlx::AnyPool` via `edda_db::DbPool`'s exposed `.any` field, so it
# needs the `any` feature enabled — the concrete driver features come
# from `edda-db`, which always compiles all three in (runtime backend
# selection).
sqlx = { workspace = true, features = ["any"] }
tower-http = { workspace = true, features = ["trace"] }
# The `Session` extractor for `oauth_routes` — stashing the CSRF
# token/nonce/PKCE verifier across the redirect round-trip to the external
# identity provider. The session *store* and *layer* are still wired up
# only by the composition root (`edda-web`'s `main.rs`); this crate only
# needs the extractor type, which works against whatever layer is already
# applied outside this router (same reasoning as `AuthSession` already
# being used throughout `auth_routes`/`admin_routes` without this crate
# ever constructing an `axum_login` layer itself).
tower-sessions = { workspace = true }
tracing = { workspace = true }

# Only the LFS integration test (`tests/lfs_integration.rs`) needs: a real
# Tokio runtime and TCP listener to run this crate's router as an actual
# HTTP server a real `git`/`git-lfs` CLI can talk to; and a real
# session/auth middleware layer (`router()` itself doesn't apply one — the
# composition root does, see `edda-web`'s `main.rs` — so the test builds
# an equivalent one, same as production, with its own throwaway SQLite
# session store regardless of which backend the test's own `DbPool` uses,
# since this test never exercises session-cookie auth, only the token
# path — see the test's own comments).
[dev-dependencies]
axum-login = { workspace = true }
sqlx = { workspace = true, features = ["sqlite"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
tower-sessions = { workspace = true }
tower-sessions-sqlx-store = { workspace = true, features = ["sqlite"] }
