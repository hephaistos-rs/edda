[package]
name = "edda-auth"
version.workspace = true
edition.workspace = true
authors.workspace = true

# Authentication (proving identity: passwords, sessions, tokens) and
# authorization (deciding what an identity may do) — two modules in one
# crate, not two crates; see plan.local.md §3.3/§3.4 for why that split
# was rejected. `authz`'s job is strictly "fetch what edda-domain's pure
# functions need, then call them" — it must never contain a permission
# *decision* itself.
[dependencies]
argon2 = { workspace = true }
axum-login = { workspace = true }
base64 = { workspace = true }
# `default-features = false`: `edda-db`'s own `sqlite` default must not be
# forced on here — which backend is compiled in is decided exactly once,
# by the composition root (`edda-web`), and every other crate in the
# graph that depends on `edda-db` needs to stay out of that decision's
# way so the top-level choice actually takes effect (plan.local.md §17
# Phase 3). This crate's own `sqlite`/`postgres` features below exist
# only so `cargo test -p edda-auth` still works standalone, unchanged.
edda-db = { workspace = true, default-features = false }
edda-domain = { workspace = true }
# Only for `russh::keys` (= the `ssh_key` crate's types, re-exported) —
# public-key parsing and fingerprinting are an authentication-credential
# concern, the same category `argon2`/`sha2` already cover here, not an
# SSH-transport one; this crate never touches `russh::server`/`client`.
# Depending on `russh` directly (rather than the standalone `ssh-key` crate)
# guarantees the exact same `PublicKey` type `edda-ssh` hands this crate at
# the authentication boundary — a separately-versioned `ssh-key` dependency
# could resolve to an incompatible type even at a semver-compatible version.
russh = { workspace = true }
serde = { workspace = true, features = ["derive"] }
sha2 = { workspace = true }
# No `sqlite`/`postgres` driver feature: this crate only ever holds an
# `edda_db::DbPool` (opaque to it) and uses `sqlx::Error` in its own error
# enums, neither of which needs a specific backend driver compiled in here
# — see plan.local.md §17 Phase 3.
sqlx = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[features]
default = ["sqlite"]
sqlite = ["edda-db/sqlite"]
postgres = ["edda-db/postgres"]
