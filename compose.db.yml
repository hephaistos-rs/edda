services:
  mysql:
    image: mariadb:12.3.3
    container_name: mysql
    restart: unless-stopped
    environment:
      # Should be randomly generated and stored in a secure location, not hardcoded in the compose file. For dev, this is fine.
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: eddadb
      MYSQL_USER: edda
      # Should be randomly generated and stored in a secure location, not hardcoded in the compose file. For dev, this is fine.
      MYSQL_PASSWORD: edda
    ports:
      - "3306:3306"
  
  postgres:
    image: postgres:18.6
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: edda
      # Should be randomly generated and stored in a secure location, not hardcoded in the compose file. For dev, this is fine.
      POSTGRES_PASSWORD: edda
      POSTGRES_DB: eddadb
    ports:
      - "5432:5432"