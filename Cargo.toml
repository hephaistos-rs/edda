[workspace]
resolver = "2"
members = [
    "crates/edda-domain",
    "crates/edda-db",
    "crates/edda-git",
    "crates/edda-render",
    "crates/edda-auth",
    "crates/edda-cli",
    "crates/edda-app",
    "crates/edda-jobs",
    "crates/edda-ssh",
    "crates/edda-telemetry",
    "app/edda-web",
]
default-members = ["app/edda-web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Damianko135 <139293484+Damianko135@users.noreply.github.com>"]
# No license has been chosen yet, so nothing here is publishable to a
# registry — make that explicit (and let `cargo deny` skip these crates in
# its third-party license policy via `[licenses.private] ignore`).
publish = false

# Workspace-wide lints. Every member opts in with a `[lints] workspace = true`
# section. CI additionally runs with `-D warnings`, so anything set to "warn"
# here is effectively "deny" on CI while staying non-blocking for local work.
[workspace.lints.rust]
# No `unsafe` anywhere in Edda's own code. Nothing in the tree needs it
# (the one historical use — wrapping an infallible `std::env::set_var` in a
# test — was removed alongside this). `forbid`, not `deny`: a crate cannot
# opt back out with an `#[allow]`.
unsafe_code = "forbid"

[workspace.lints.clippy]
# A curated subset of `clippy::pedantic` — the lints the tree already
# satisfies in full, so they can be enforced from day one. The rest of
# `pedantic` (`missing_errors_doc`, `must_use_candidate`, the `cast_*`
# family, …) is a burn-down for later phases; add entries here as each is
# driven to zero. Keep alphabetical.
checked_conversions = "warn"
cloned_instead_of_copied = "warn"
enum_glob_use = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
from_iter_instead_of_collect = "warn"
index_refutable_slice = "warn"
inefficient_to_string = "warn"
invalid_upcast_comparisons = "warn"
iter_not_returning_iterator = "warn"
large_stack_arrays = "warn"
manual_instant_elapsed = "warn"
manual_ok_or = "warn"
manual_string_new = "warn"
map_flatten = "warn"
match_wildcard_for_single_variants = "warn"
maybe_infinite_iter = "warn"
mut_mut = "warn"
needless_for_each = "warn"
no_effect_underscore_binding = "warn"
ptr_as_ptr = "warn"
redundant_else = "warn"
ref_binding_to_reference = "warn"
ref_option_ref = "warn"
same_functions_in_if_condition = "warn"
stable_sort_primitive = "warn"
unnecessary_box_returns = "warn"
unnecessary_join = "warn"
unnecessary_wraps = "warn"
unnested_or_patterns = "warn"
unreadable_literal = "warn"
zero_sized_map_values = "warn"

# Centralized so every crate that needs a shared dependency (e.g. `serde`
# on both `edda-domain` and `edda-db`) references the same resolved
# version.
[workspace.dependencies]
edda-domain = { path = "crates/edda-domain" }
edda-db = { path = "crates/edda-db" }
edda-git = { path = "crates/edda-git" }
edda-render = { path = "crates/edda-render" }
edda-auth = { path = "crates/edda-auth" }
edda-cli = { path = "crates/edda-cli" }
edda-app = { path = "crates/edda-app" }
edda-jobs = { path = "crates/edda-jobs" }
edda-ssh = { path = "crates/edda-ssh" }
edda-telemetry = { path = "crates/edda-telemetry" }

# Secret-at-rest encryption for the TOTP shared secret (`totp_secrets.
# secret_ciphertext`) — see `crates/edda-auth/src/secret_box.rs`'s doc
# comment. Verified live on crates.io before adoption (0.11.1,
# 2026-08-21) and chosen for the same RustCrypto-family/pure-Rust
# reasoning already applied to `sha2`/`argon2` in this workspace. Scoped
# narrowly to the one secret that needs to be stored reversibly today;
# webhook secrets and OAuth client secrets are separate, still-open
# at-rest-encryption questions for whenever those features are built.
aes-gcm = "0.11.1"
argon2 = "0.5.3"
async-trait = "0.1.92"
axum = "0.8.9"
axum-login = "0.18.0"
base64 = "0.22.1"
bytes = "1.12.1"
# Only for `edda-auth`'s OAuth/OIDC mock-identity-provider test fixture
# (`openidconnect`'s own `CoreIdTokenClaims` timestamps are `chrono`
# types) — not used by any non-test code in this workspace.
chrono = "0.4.45"
# GFM-compatible markdown -> HTML. Paired unconditionally with `ammonia`
# below — every markdown render in this workspace must go through HTML
# sanitization, no exceptions. `default-features = false` here: comrak's
# own defaults pull in `syntect` with its Oniguruma (C library) regex
# backend for comrak's own optional code-fence-highlighting integration,
# which this workspace doesn't use (`edda-render::syntax` does its own
# highlighting against a separately pinned, pure-Rust-backend `syntect`
# below) and which would otherwise silently defeat that pure-Rust choice
# via Cargo's whole-graph feature unification. Cargo only lets a member
# crate opt *into* a workspace dependency's default features, not out of
# them, so the default has to be off here for `edda-render`'s `Cargo.toml`
# to be able to leave it off.
comrak = { version = "0.54.0", default-features = false }
dioxus = "0.7.1"
dioxus-free-icons = "0.10.0"
flate2 = "1.1.9"
gix = "0.86.0"
# Owned actor-identity type (`Signature`), only needed directly by
# `edda-git::diff`'s test fixtures for hand-building commits without
# shelling out to `git` — `gix` itself depends on this transitively at the
# same version already (confirmed via `cargo tree -p edda-git -i gix-actor`).
# `edda-git::diff::commit_diff` itself uses `gix::Repository::
# diff_tree_to_tree` (`gix`'s own wrapper around the tree-diff functionality
# `gix-diff` provides), never a `gix_diff::`-namespaced type by name, so
# `gix-diff` doesn't need its own direct dependency entry here.
gix-actor = "0.41.2"
gix-hash = "0.26.0"
gix-object = "0.63.0"
gloo-net = "0.7.0"
# The core rate-limiting algorithm `tower_governor` (`edda_app::rate_limit`)
# is built on — already a transitive dependency of that crate;
# named directly here only so `edda-app` can spell out its middleware's
# concrete generic type (`governor::middleware::NoOpMiddleware<governor::
# clock::QuantaInstant>`) instead of an opaque `impl Trait` return, not to
# add any new capability or supply-chain surface beyond what `tower_governor`
# already pulls in. Left unpinned to whatever patch version `tower_governor`
# 0.8's own `^0.10.0` requirement resolves to.
governor = "0.10"
# HTML sanitizer run on every `comrak` output — see that dependency's own
# comment.
ammonia = "4.1.4"
# Webhook payload signing (HMAC-SHA256, `edda_auth::webhook_signing`) — a
# standalone dependency rather than reusing `jsonwebtoken`'s bundled HMAC:
# that crate only exposes HMAC wrapped in its own JWT-shaped API (sign/
# verify a `Header`+`Claims` pair), not a raw `sign(secret, payload) ->
# digest` primitive, which is what an outgoing-webhook signature is.
# RustCrypto family, matching `sha2`/`argon2`/`aes-gcm` already in this
# tree. Pinned to `0.12`, not the newer `0.13`: `jsonwebtoken`'s
# `rust_crypto` backend already pulls `hmac` 0.12 (paired with `digest`
# 0.10, the same major version `sha2` 0.10 already uses everywhere in this
# workspace) — `0.13` depends on `digest` 0.11 instead, which doesn't
# implement the trait bounds `Hmac<Sha256>` needs against this workspace's
# `sha2`-0.10-derived `Sha256` type, so it fails to compile as a second,
# incompatible version rather than reusing the one already resolved.
hmac = "0.12"
# Only HMAC (`hmac`/`sha2`) is actually used here (HS256), but the crate
# has no narrower "HMAC-only" feature to enable instead.
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
# Outbound email (password-reset links, mention notifications,
# `edda_web`'s job handlers) — an optional-but-first-class capability
# (`AGENTS.md`'s dependency principle): Edda runs standalone with no SMTP
# configured (the job handler no-ops, logging instead of failing, when
# `EDDA_SMTP_*` isn't set), but sends real mail when it is. `rustls`-backed
# (`tokio1-rustls-tls`), not `native-tls` (this crate's own default) — the
# same native-C-dependency avoidance already applied throughout this
# workspace; `default-features = false` drops `native-tls` so a member
# crate opting into this workspace dependency can't accidentally re-enable
# it (Cargo only lets a crate opt *into* a workspace dependency's default
# features, never out of them, the same reasoning already documented next
# to `comrak` above).
lettre = { version = "0.11.23", default-features = false, features = [
    "smtp-transport",
    "tokio1",
    "tokio1-rustls-tls",
    "builder",
    "pool",
] }
# OAuth2/OIDC *consumer* login (`edda-auth::oauth`) — Edda authenticates
# against external identity providers; it does not act as an OAuth/OIDC
# provider itself. `openidconnect` pulls its own compatible `oauth2`
# (5.0.0) transitively; both are named here for clarity, but direct
# usage goes through `openidconnect`'s `CoreClient`, which is a strict
# superset of the plain-OAuth2 flow this needs.
oauth2 = "5.0.0"
openidconnect = "4.0.1"
opentelemetry = "0.32.0"
opentelemetry-appender-tracing = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", default-features = false }
opentelemetry-semantic-conventions = "0.32.1"
opentelemetry_sdk = "0.32.1"
# Matches the version russh's own examples use for host-key generation
# (`russh`'s published `Cargo.toml` dev-dependencies) — needed for
# `ssh_key::PrivateKey::random`'s `CryptoRng` bound.
rand = { version = "0.10", features = ["thread_rng"] }
# Outbound HTTP for webhook delivery (`edda_web`'s job handlers) — pinned
# to the `0.12` line, not the newer `0.13`, deliberately: `oauth2`/
# `openidconnect` (already workspace dependencies) pull `reqwest` 0.12
# transitively with `rustls-tls`'s `ring` crypto provider (confirmed via
# `cargo tree -i ring`), matching this workspace's existing `ring`-over-
# `aws-lc-rs` preference (`russh`'s own comment below) for free; `0.13`'s
# `rustls` feature hardcodes the `aws-lc-rs` provider instead (verified via
# a real `cargo build` in an isolated probe project) and would pull in a
# second, redundant native-code TLS backend alongside the one already in
# the graph. `default-features = false` drops `default-tls` (`native-tls`,
# a C dependency this workspace avoids wherever a pure-Rust path exists).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# `ring` crypto backend selected over the `aws-lc-rs` default — see
# `crates/edda-ssh/Cargo.toml`'s doc comment for the rationale.
russh = { version = "0.63", default-features = false, features = ["ring", "rsa"] }
serde = "1.0.229"
serde_json = "1.0.145"
sha2 = "0.10.9"
sqlx = "0.8.6"
# `default-fancy` (fancy-regex backend), not `default-onig` — Onig is a C
# library, and this workspace avoids native/C dependencies wherever a
# pure-Rust alternative exists (the same preference already applied to
# `russh`'s `ring` backend and `jsonwebtoken`'s `rust_crypto` backend).
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
thiserror = "2.0.20"
tokio = "1.53.1"
# TOTP (RFC 6238) enrollment/verification. `std` (default) + `gen_secret`
# for server-side secret generation + `otpauth` for the `otpauth://` URI
# manual-entry/QR string.
totp-rs = { version = "6.0.0", features = ["gen_secret", "otpauth"] }
# General API rate limiting (`edda_app::rate_limit`) — a
# key-based token-bucket middleware over the pure-Rust `governor` crate
# (no native/C dependency, matching this workspace's existing preference).
# `default-features = false` drops the default `tonic` feature (this
# workspace has no gRPC surface to rate-limit) while keeping `axum` (this
# crate's own `IntoResponse`/`Response<axum::body::Body>` glue for a
# rejected request) and `tracing` (a "rate limit exceeded" log line
# through this workspace's existing subscriber, matching the observability
# level everything else in `edda-app` already has). Verified live on
# crates.io before adoption (0.8.0, 2025-08-14) — compatible with this
# workspace's `axum` 0.8/`tower` 0.5 already in the graph, confirmed via
# its own published `Cargo.toml`.
tower_governor = { version = "0.8", default-features = false, features = [
    "axum",
    "tracing",
] }
tower-http = "0.6.11"
tower-sessions = "0.14.0"
tower-sessions-sqlx-store = "0.15.0"
tracing = "0.1.44"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = "0.3.23"
uuid = "1.24.1"
web-time = "1.1.0"
# WebAuthn/passkey registration+authentication ceremony (`edda_auth::webauthn`).
# Deliberately not `webauthn-rs`: that crate's `webauthn-rs-core` unconditionally
# depends on `webauthn-attestation-ca` -> `openssl`/`openssl-sys`, a native C
# dependency that fails to build on this workspace's Windows/MSVC toolchain
# (verified with real `cargo build`s, not just `cargo check`) and that this
# workspace otherwise avoids everywhere else (`ring` over `aws-lc-rs` for
# `russh`, `rust_crypto` for `jsonwebtoken`, `fancy-regex` for `syntect`).
# `passkey-types` + `coset` + `p256` is an entirely openssl-free,
# RustCrypto-family alternative (verified via `cargo tree` and a real
# `cargo build` in an isolated probe project) — `passkey-types` supplies the
# WebAuthn JSON/CBOR request-response types (matching the browser
# `navigator.credentials` JSON shape 1:1, with `serialize_bytes_as_base64_string`
# so `Bytes` fields round-trip as base64url strings) and CTAP2's
# `AuthenticatorData::from_slice`/`AttestedCredentialData` parsers; `coset`
# (re-exported by `passkey-types` for `CoseKey`, depended on directly here for
# `iana`/CBOR value access) gives `CoseKey::to_sec1_octet_string()` to recover
# a P-256 point from an attested credential's COSE key; `p256`'s `ecdsa`
# module verifies the ES256 assertion signature. None of these are an
# off-the-shelf relying-party verifier — `passkey-rs` is built for WebAuthn
# *clients*/authenticators, not servers — so `edda_auth::webauthn` implements
# the actual RP-side ceremony (challenge issuance, origin/RP-ID/signature
# verification, sign-counter tracking) itself on top of these primitives.
coset = "0.4.2"
p256 = "0.14.0"
passkey-types = { version = "0.5.0", features = ["serialize_bytes_as_base64_string"] }
