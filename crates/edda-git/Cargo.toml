[package]
name = "edda-git"
version.workspace = true
edition.workspace = true
authors.workspace = true

# Git repository storage and gix-backed operations — server-only,
# transport-agnostic. Both `edda-http`'s
# git-over-HTTP bridge and `edda-ssh`'s git-over-SSH bridge call into this
# crate's `protocol` module for the actual smart-protocol request/response
# orchestration; it knows nothing about either transport (no `axum`, no
# `russh`) — `bytes::Bytes` is a generic, transport-agnostic buffer type,
# not an HTTP- or SSH-specific one, so depending on it directly here (the
# same type both transports already hand around) doesn't violate that.
[dependencies]
bytes = { workspace = true }
edda-domain = { workspace = true }
edda-telemetry = { workspace = true }
flate2 = { workspace = true }
gix = { workspace = true }
gix-hash = { workspace = true, features = ["sha1"] }
gix-object = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt"] }
tracing = { workspace = true }

[dev-dependencies]
# `tree-editor`: only needed by `diff`'s test fixtures, which hand-build
# commits (`gix::Repository::edit_tree`) rather than shelling out to `git` —
# not needed by any non-test code in this crate, so scoped to dev-only here
# rather than added to the main `gix` dependency above.
gix = { workspace = true, features = ["tree-editor"] }
gix-actor = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
