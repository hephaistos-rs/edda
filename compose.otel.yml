# Minimal local observability stack: an OpenTelemetry Collector (the
# backend-neutral boundary Edda actually talks to) in front of a single
# grafana/otel-lgtm container (Tempo for traces, Loki for logs, Prometheus
# for metrics, and Grafana as the one UI for all three — pre-wired, nothing
# else to configure). Grafana also opens straight onto a pre-built "Edda"
# dashboard (grafana/dashboards/edda.json) instead of its generic home page.
#
# Usage:
#   docker compose -f compose.otel.yml up
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 cargo run --features server
#   open http://localhost:3000 (Grafana; login admin/admin)
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-config.yaml"]
    volumes:
      - ./otel-config.yaml:/etc/otel-config.yaml:ro
    ports:
      - "4318:4318" # OTLP HTTP — this is the endpoint Edda's OTEL_EXPORTER_OTLP_ENDPOINT should point at
    depends_on:
      - grafana-lgtm

  grafana-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000" # Grafana UI
    volumes:
      # Mount path verified against the running image (v0.30.2): its own
      # default dashboards (RED Metrics, JVM Overview) are provisioned from
      # this same /otel-lgtm/grafana/conf/provisioning/dashboards/ directory,
      # so a custom provider follows that convention.
      - ./grafana/dashboards/edda.json:/otel-lgtm/grafana/conf/provisioning/dashboards/edda/edda.json:ro
      - ./grafana/dashboard-provisioning.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/edda.yaml:ro
    environment:
      # Opens directly onto the Edda dashboard instead of Grafana's generic
      # home page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/edda/edda.json
