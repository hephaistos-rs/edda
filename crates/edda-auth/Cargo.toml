[package]
name = "edda-auth"
version.workspace = true
edition.workspace = true
authors.workspace = true

# Authentication (proving identity: passwords, sessions, tokens) and
# authorization (deciding what an identity may do) — two modules in one
# crate, not two crates, since both are identity/permission concerns that
# share the same persistence access and are used together at every
# transport boundary; splitting them would only duplicate wiring without
# a real architectural seam. `authz`'s job is strictly "fetch what edda-domain's pure
# functions need, then call them" — it must never contain a permission
# *decision* itself.
[dependencies]
argon2 = { workspace = true }
axum-login = { workspace = true }
base64 = { workspace = true }
edda-db = { workspace = true }
edda-domain = { workspace = true }
# Only for `russh::keys` (= the `ssh_key` crate's types, re-exported) —
# public-key parsing and fingerprinting are an authentication-credential
# concern, the same category `argon2`/`sha2` already cover here, not an
# SSH-transport one; this crate never touches `russh::server`/`client`.
# Depending on `russh` directly (rather than the standalone `ssh-key` crate)
# guarantees the exact same `PublicKey` type `edda-ssh` hands this crate at
# the authentication boundary — a separately-versioned `ssh-key` dependency
# could resolve to an incompatible type even at a semver-compatible version.
russh = { workspace = true }
serde = { workspace = true, features = ["derive"] }
sha2 = { workspace = true }
# No `sqlite`/`postgres` driver feature: this crate only ever holds an
# `edda_db::DbPool` (opaque to it) and uses `sqlx::Error` in its own error
# enums, neither of which needs a specific backend driver compiled in
# here.
sqlx = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
