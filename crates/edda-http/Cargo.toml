[package]
name = "edda-http"
version.workspace = true
edition.workspace = true
authors.workspace = true

# The axum application: the git smart-HTTP bridge, account/token routes,
# collaborator-management routes, and cross-cutting middleware
# (observability, health check). Handlers call into `edda-auth`'s
# `AuthorizationService` and `edda-domain`'s pure functions for every
# permission decision — they never re-derive access themselves. See
# plan.local.md §3.3/§10.
[dependencies]
axum = { workspace = true }
axum-login = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
edda-auth = { workspace = true }
# `default-features = false`: see `edda-auth/Cargo.toml`'s identical note
# — backend selection is the composition root's decision alone
# (plan.local.md §17 Phase 3).
edda-db = { workspace = true, default-features = false }
edda-domain = { workspace = true }
edda-git = { workspace = true }
edda-telemetry = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# No driver feature hardcoded here either — this crate's one direct
# `sqlx::query` use (the `/healthz` liveness check, `SELECT 1`, identical
# on both backends) just needs *a* driver compiled in somewhere in the
# graph, which `edda-db`'s chosen feature already provides transitively.
sqlx = { workspace = true }
tower-http = { workspace = true, features = ["trace"] }
tracing = { workspace = true }

[features]
default = ["sqlite"]
sqlite = ["edda-db/sqlite", "sqlx/sqlite"]
postgres = ["edda-db/postgres", "sqlx/postgres"]
