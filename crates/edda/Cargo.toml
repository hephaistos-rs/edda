[package]
name = "edda"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

# The composition root: `main()` parses `Settings`, wires `AppState`,
# mounts `edda_web::App` (SSR + assets) merged with `edda_app::router`
# (the API + git-HTTP + LFS), and starts the poller / dispatcher / SSH
# listener. This is the only package that compiles for both the wasm32
# client and the native server (Dioxus fullstack's constraint), so every
# server-only dependency stays behind `dep:` / the `server` feature.
[lints]
workspace = true

[dependencies]
# `session_store::AnySessionStore`'s `SessionStore` impl must match that
# trait's `#[async_trait]` shape.
async-trait = { workspace = true, optional = true }
# Seeds the `instance_settings` runtime cache once at startup, before the
# first request, then hands the shared handle to `edda-app` via
# `RuntimeConfig`.
arc-swap = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
axum-login = { workspace = true, optional = true }
dioxus = { workspace = true, features = ["fullstack"] }
edda-app = { workspace = true, optional = true }
edda-auth = { workspace = true, optional = true }
edda-db = { workspace = true, optional = true }
edda-domain = { workspace = true, optional = true }
edda-git = { workspace = true, optional = true }
edda-jobs = { workspace = true, optional = true }
edda-ssh = { workspace = true, optional = true }
edda-telemetry = { workspace = true, optional = true }
# The UI crate. Its `web` / `server` features track this crate's own.
edda-web = { workspace = true }
# Outbound email (`jobs::send_email`, password-reset delivery).
lettre = { workspace = true, optional = true }
# Outbound webhook delivery (`jobs::deliver_webhook`).
reqwest = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# `tower-sessions-sqlx-store` needs a *concrete* typed pool (not `AnyPool`)
# — `session_store` opens that one typed connection. The narrow,
# documented exception in `AGENTS.md`.
sqlx = { workspace = true, features = ["any", "sqlite", "postgres", "mysql"], optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync", "rt", "signal", "time", "net"], optional = true }
tower-sessions = { workspace = true, optional = true }
tower-sessions-sqlx-store = { workspace = true, features = ["sqlite", "postgres", "mysql"], optional = true }
tracing = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }

[features]
default = ["web"]
web = ["dioxus/web", "edda-web/web"]
server = [
    "dioxus/server",
    "edda-web/server",
    "dep:arc-swap",
    "dep:async-trait",
    "dep:axum",
    "dep:axum-login",
    "dep:edda-app",
    "dep:edda-auth",
    "dep:edda-db",
    "dep:edda-domain",
    "dep:edda-git",
    "dep:edda-jobs",
    "dep:edda-ssh",
    "dep:edda-telemetry",
    "dep:lettre",
    "dep:reqwest",
    "dep:sqlx",
    "dep:thiserror",
    "dep:tokio",
    "dep:tower-sessions",
    "dep:tower-sessions-sqlx-store",
]
