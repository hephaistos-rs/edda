[package]
name = "edda-jobs"
version.workspace = true
edition.workspace = true
authors.workspace = true

# The background-job poller: a hand-rolled `tokio::spawn` +
# polling loop over `edda-db`'s `jobs` table, not a third-party queue
# crate. Deliberately depends on `edda-domain` + `edda-db` only — never
# `edda-http`/`edda-auth`: the actual handler *logic* ("send this
# webhook," "send this email") needs those crates' capabilities (HTTP
# client, secret decryption), so it's defined in `edda-web`'s composition
# root, where those dependencies already exist, and registered *into* this
# crate's dispatch table — the dependency runs shell-calls-handler, never
# handler-crate-depends-on-transport-crate.
[dependencies]
edda-db = { workspace = true }
edda-domain = { workspace = true }
edda-telemetry = { workspace = true }
rand = { workspace = true, features = ["thread_rng"] }
# No sqlite/postgres/mysql driver feature: this crate only ever holds an
# `edda_db::DbPool` (opaque to it) and uses `sqlx::Error` in its own
# function signatures — the same narrow reasoning already documented in
# `crates/edda-auth/Cargo.toml`.
sqlx = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
