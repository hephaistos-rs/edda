[package]
name = "edda"
version.workspace = true
edition.workspace = true
authors.workspace = true

# The workspace's composition root. This is the only package that needs
# to compile for both the wasm32 client and the native server (Dioxus
# fullstack's own constraint), so it's also the only package where every
# server-only dependency below must stay behind `dep:`/the `server`
# feature.
[dependencies]
# Only for `session_store::AnySessionStore`'s `SessionStore` impl, which
# must match that trait's own `#[async_trait]` shape.
async-trait = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
axum-login = { workspace = true, optional = true }
dioxus = { workspace = true, features = ["router", "fullstack"] }
dioxus-free-icons = { workspace = true, features = ["lucide"] }
edda-auth = { workspace = true, optional = true }
edda-db = { workspace = true, optional = true }
edda-domain = { workspace = true, optional = true }
edda-git = { workspace = true, optional = true }
edda-http = { workspace = true, optional = true }
# The job poller + handler registry (`main.rs`'s composition root builds
# and registers the actual handler closures here — see that crate's own
# `Cargo.toml` doc comment for why the logic lives here, not inside
# `edda-jobs` itself).
edda-jobs = { workspace = true, optional = true }
edda-render = { workspace = true, optional = true }
edda-ssh = { workspace = true, optional = true }
edda-telemetry = { workspace = true, optional = true }
gloo-net = { workspace = true, features = ["json"], optional = true }
# Outbound webhook delivery (`job_handlers::deliver_webhook`) — see the
# workspace `Cargo.toml`'s own comment on why `0.12`/`rustls-tls` over
# `0.13`'s hardcoded `aws-lc-rs` provider.
reqwest = { workspace = true, optional = true }
# Outbound email (`job_handlers::send_email`, password-reset delivery) —
# see the workspace `Cargo.toml`'s own comment for the `rustls`/
# `native-tls`-avoidance reasoning.
lettre = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
# Not optional: `ui/webauthn_js` passes the WebAuthn ceremony options/
# response JSON through unopened (server and browser agree on the shape,
# `ui/` never needs to interpret individual fields) — see that module's
# own doc comment for why `serde_json::Value` rather than a duplicated
# set of typed DTOs.
serde_json = { workspace = true }
# Backend (SQLite/PostgreSQL/MySQL-MariaDB) is a runtime choice, selected
# by `EDDA_DATABASE_URL`'s scheme — one compiled binary, all three
# drivers linked in.
# `tower-sessions-sqlx-store`'s session store is the one place this crate
# still needs a *concrete* (not `AnyPool`) typed pool — it doesn't
# support `sqlx::Any` — so `main.rs` opens a second, small, typed
# connection alongside `edda_db::DbPool`'s `AnyPool` for sessions only,
# picking whichever of `SqliteStore`/`PostgresStore`/`MySqlStore` matches
# the same runtime-detected backend.
sqlx = { workspace = true, features = ["any", "sqlite", "postgres", "mysql"], optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync", "rt", "signal", "time", "net"], optional = true }
tower-sessions = { workspace = true, optional = true }
tower-sessions-sqlx-store = { workspace = true, features = ["sqlite", "postgres", "mysql"], optional = true }
# Not optional: `tracing`'s macros (`info!`, `#[instrument]`, ...) are used
# from server-only code paths, but the facade itself is tiny and
# side-effect-free to depend on — Dioxus already pulls it in transitively
# either way.
tracing = { workspace = true }
# Not optional: used from `ui/`, which compiles for both the wasm client and
# the native server. Plain `std::time::SystemTime::now()` panics on
# wasm32-unknown-unknown (no wall clock without a JS shim) — this is a
# drop-in replacement that's `std::time` on every other target and backed by
# `Date.now()` on wasm32.
web-time = { workspace = true }

[features]
default = ["web"]
web = ["dioxus/web", "dep:gloo-net"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = [
    "dioxus/server",
    "dep:async-trait",
    "dep:axum",
    "dep:axum-login",
    "dep:edda-auth",
    "dep:edda-db",
    "dep:edda-domain",
    "dep:edda-git",
    "dep:edda-http",
    "dep:edda-jobs",
    "dep:edda-render",
    "dep:edda-ssh",
    "dep:edda-telemetry",
    "dep:lettre",
    "dep:reqwest",
    "dep:sqlx",
    "dep:thiserror",
    "dep:tokio",
    "dep:tower-sessions",
    "dep:tower-sessions-sqlx-store",
]
