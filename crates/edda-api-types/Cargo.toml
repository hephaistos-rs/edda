[package]
name = "edda-api-types"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

# The `/api/v1` wire contract: every request and response DTO, in one
# place. `edda-app` serializes these; `edda-web` deserializes them. A
# serde-only leaf crate with no other dependency, so it compiles for
# wasm32 as cheaply as for the server and the UI can depend on it without
# pulling a single server-side crate into its graph.
[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
