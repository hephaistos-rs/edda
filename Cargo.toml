[workspace]
resolver = "2"
members = [
    "crates/edda-domain",
    "crates/edda-db",
    "crates/edda-git",
    "crates/edda-auth",
    "crates/edda-http",
    "crates/edda-ssh",
    "crates/edda-telemetry",
    "app/edda-web",
]
default-members = ["app/edda-web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Damianko135 <139293484+Damianko135@users.noreply.github.com>"]

# Centralized so every crate that needs a shared dependency (e.g. `serde`
# on both `edda-domain` and `edda-db`) references the same resolved
# version — see plan.local.md §3 for the workspace-crate rationale.
[workspace.dependencies]
edda-domain = { path = "crates/edda-domain" }
# `default-features = false` here, not just on individual consumers' own
# dependency edges: Cargo ignores a consumer's `default-features = false`
# override on a workspace-inherited dependency unless the
# `workspace.dependencies` entry itself declares a `default-features`
# value (a real Cargo restriction, hit while wiring plan.local.md §17
# Phase 3's backend-selection feature graph — confirmed via `cargo`'s own
# "this could become a hard error in the future" warning). Each of these
# four crates has its own `[features] default = ["sqlite"]` that
# re-enables `edda-db`'s `sqlite` feature explicitly, so nothing loses
# today's zero-config default by this changing here.
edda-db = { path = "crates/edda-db", default-features = false }
edda-git = { path = "crates/edda-git" }
edda-auth = { path = "crates/edda-auth", default-features = false }
edda-http = { path = "crates/edda-http", default-features = false }
edda-ssh = { path = "crates/edda-ssh", default-features = false }
edda-telemetry = { path = "crates/edda-telemetry" }

argon2 = "0.5.3"
axum = "0.8.9"
axum-login = "0.18.0"
base64 = "0.22.1"
bytes = "1.12.1"
dioxus = "0.7.1"
dioxus-free-icons = "0.10.0"
flate2 = "1.1.9"
gix = "0.86.0"
gix-hash = "0.26.0"
gix-object = "0.63.0"
gloo-net = "0.7.0"
opentelemetry = "0.32.0"
opentelemetry-appender-tracing = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", default-features = false }
opentelemetry-semantic-conventions = "0.32.1"
opentelemetry_sdk = "0.32.1"
# Matches the version russh's own examples use for host-key generation
# (`russh`'s published `Cargo.toml` dev-dependencies) — needed for
# `ssh_key::PrivateKey::random`'s `CryptoRng` bound.
rand = { version = "0.10", features = ["thread_rng"] }
# `ring` crypto backend selected over the `aws-lc-rs` default — see
# `crates/edda-ssh/Cargo.toml`'s doc comment and plan.local.md §23.
russh = { version = "0.63", default-features = false, features = ["ring", "rsa"] }
serde = "1.0.229"
serde_json = "1.0.145"
sha2 = "0.10.9"
sqlx = "0.8.6"
thiserror = "2.0.20"
tokio = "1.53.1"
tower-http = "0.6.11"
tower-sessions = "0.14.0"
tower-sessions-sqlx-store = "0.15.0"
tracing = "0.1.44"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = "0.3.23"
uuid = "1.24.1"
web-time = "1.1.0"
